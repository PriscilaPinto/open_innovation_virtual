name: 🛡️ Homolog Post-Merge Security Gate

on:
  push:
    branches:
      - homolog # Dispara automaticamente assim que o PR da IA for aprovado e fundido aqui

permissions:
  contents: read

jobs:
  post-merge-validation:
    name: 🔍 Scan de Validação Pós-Merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Homolog Branch
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Final Trivy Scan
        run: |
          trivy fs . \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1 # Se o patch da IA falhar e ainda houver vulnerabilidade alta, a esteira quebra aqui